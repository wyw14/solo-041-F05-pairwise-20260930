<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTreat 工艺总控</title><link rel="stylesheet" href="/assets/app.css"></head>
<body>
<header><div class="brand">BioTreat 工艺联控</div><nav><a aria-current="page" href="/process">工艺总控</a><a href="/aeration">曝气调节</a><a href="/sludge">污泥回流</a><a href="/alarms">异常处置</a></nav></header>
<main>
  <div class="page-head"><div><h1>处理线运行</h1><div class="muted">进水接纳、批次阶段和出水状态</div></div><div class="status"><span class="dot"></span><span id="health">checking</span></div></div>
  <div class="grid">
    <section class="panel wide"><h2>处理线</h2><table><thead><tr><th>处理线</th><th>阶段</th><th>代际</th><th>批次</th></tr></thead><tbody id="lines"></tbody></table></section>
    <section class="panel"><h2>接纳进水</h2><form id="start"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>流量 m³/h<input name="flow" type="number" value="760" min="1"></label><label>来源<input name="source" value="north-intake"></label><button>创建处理批次</button></form></section>
    <section class="panel wide"><h2>沉淀周期与界面测量</h2>
      <table><thead><tr><th>处理线</th><th>周期阶段</th><th>阶段进入</th><th>最近有效界面测量</th><th>延迟原因</th><th>操作</th></tr></thead><tbody id="cycles"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody></table>
      <div class="muted" style="margin-top:8px">fill 阶段证据齐备可直接推进到 decant；界面超高、有效采样不足或存在活动告警时将停留在 settle 并给出延迟原因。</div>
    </section>
    <section class="panel wide"><h2>最近操作</h2><pre id="output">等待操作</pre></section>
    <section class="panel"><h2>急停隔离</h2><form id="stop"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>原因<input name="reason" value="operator safety check"></label><button class="danger">隔离处理线</button></form></section>
  </div>
</main>
<script src="/assets/common.js"></script><script>
const LINE_IDS=['line-1','line-2','line-3'];
function at(value){return value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'-';}
function phaseEntered(cycle){
  if(!cycle)return '-';
  if(cycle.phase==='settle')return at(cycle.settled_at);
  if(cycle.phase==='decant')return at(cycle.decant_at);
  if(cycle.phase==='done')return at(cycle.decant_at);
  return at(cycle.started_at);
}
function readingCell(settling,cycle){
  if(!cycle){return '<span class="muted">无活跃周期</span>';}
  if(!settling||!settling.sample_count){return '<span class="muted">本周期尚无有效测量</span>';}
  const flag=settling.high?'<strong style="color:#a63e37"> 界面超高</strong>':'';
  return `${Number(settling.blanket_level).toFixed(2)} m · ${settling.sample_count} 次 · ${at(settling.last_reading_at)}${flag}`;
}
async function loadLines(){
  const data=await request('/api/process-lines');
  document.querySelector('#lines').innerHTML=data.lines.map(x=>`<tr><td>${x.line_id}</td><td>${x.stage}</td><td>${x.generation}</td><td>${x.batch_id||'-'}</td></tr>`).join('');
  const statuses=await Promise.all(LINE_IDS.map(id=>request(`/api/process-lines/${id}`)));
  document.querySelector('#cycles').innerHTML=statuses.map(s=>{
    const c=s.cycle;
    const phase=c?c.phase:'-';
    const holds=(c&&c.hold_reasons&&c.hold_reasons.length)?`<span style="color:#a63e37">${c.hold_reasons.join('；')}</span>`:'<span class="muted">-</span>';
    return `<tr><td>${s.line.id}</td><td>${phase}</td><td>${phaseEntered(c)}</td><td>${readingCell(s.settling,c)}</td><td>${holds}</td>`+
      `<td><button data-line="${s.line.id}" data-action="begin">开始周期</button> <button data-line="${s.line.id}" data-action="advance">推进阶段</button></td></tr>`;
  }).join('');
  document.querySelectorAll('#cycles button').forEach(b=>b.onclick=async()=>{
    const path=`/api/settling/${b.dataset.line}/cycles${b.dataset.action==='advance'?'/advance':''}`;
    try{show(await request(path,{method:'POST',body:'{}'}));}catch(err){showError(err);}
    loadLines().catch(showError);
  });
}
document.querySelector('#start').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request(`/api/process-lines/${f.get('line')}/batches`,{method:'POST',body:JSON.stringify({flow_m3_hour:Number(f.get('flow')),source:f.get('source')})}));loadLines()}catch(err){showError(err)}});
document.querySelector('#stop').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request(`/api/emergency/${f.get('line')}`,{method:'POST',body:JSON.stringify({reason:f.get('reason')})}));loadLines()}catch(err){showError(err)}});loadLines().catch(showError);
</script></body></html>
